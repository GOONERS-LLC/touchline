name: Touchline
options:
  bundleIdPrefix: com.goonersllc
  deploymentTarget:
    iOS: "17.0"
  swiftVersion: "5.9"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "Touchline"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  Touchline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Touchline
        excludes:
          - "**/*.md"
      - path: Touchline/Data/Resources
        type: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goonersllc.touchline
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "2.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  TouchlineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TouchlineUITests
    dependencies:
      - target: Touchline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goonersllc.touchline.uitests
        TEST_TARGET_NAME: Touchline
        CODE_SIGNING_ALLOWED: NO

schemes:
  Touchline:
    build:
      targets:
        Touchline: all
        TouchlineUITests: [test]
    test:
      config: Debug
      targets:
        - TouchlineUITests
    archive:
      config: Release
